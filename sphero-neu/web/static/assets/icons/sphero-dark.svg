<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="shell-dark" cx="35%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#283548"/>
      <stop offset="55%" stop-color="#131923"/>
      <stop offset="100%" stop-color="#090c12"/>
    </radialGradient>
    <linearGradient id="rim-dark" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#2e3b4e"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
  </defs>
  <!-- Outer polycarbonate sphere -->
  <circle cx="32" cy="32" r="28" fill="url(#shell-dark)" stroke="url(#rim-dark)" stroke-width="2.5"/>
  <!-- Equatorial robotics seam -->
  <ellipse cx="32" cy="33" rx="27.5" ry="9.5" stroke="#388bfd" stroke-opacity="0.32" stroke-width="1.4" stroke-dasharray="4 3"/>
  <!-- Forward aim arc -->
  <path d="M22 10.5 A24 24 0 0 1 42 10.5" stroke="#58a6ff" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Inner 8x8 LED Matrix housing -->
  <rect x="20" y="20" width="24" height="24" rx="4" fill="#070a0f" stroke="#263345" stroke-width="1.2"/>
  <!-- Glowing BOLT LED Matrix Pixels (bolt / arrow motif) -->
  <g fill="#58a6ff">
    <rect x="29" y="22.5" width="6" height="3" rx="0.8"/>
    <rect x="26" y="26.5" width="12" height="3" rx="0.8" fill="#388bfd"/>
    <rect x="23" y="30.5" width="18" height="3" rx="0.8" fill="#79c0ff"/>
    <rect x="26" y="34.5" width="12" height="3" rx="0.8" fill="#388bfd"/>
    <rect x="29" y="38.5" width="6" height="3" rx="0.8"/>
  </g>
  <!-- Polycarbonate dome specular highlight -->
  <ellipse cx="22" cy="18" rx="7" ry="3.5" transform="rotate(-28 22 18)" fill="#ffffff" fill-opacity="0.18"/>
</svg>
