<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="shell-light" cx="35%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#faf7f0"/>
      <stop offset="58%" stop-color="#e8e0ce"/>
      <stop offset="100%" stop-color="#cfc3ab"/>
    </radialGradient>
    <linearGradient id="rim-light" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0077b8"/>
      <stop offset="50%" stop-color="#b9ad94"/>
      <stop offset="100%" stop-color="#005e94"/>
    </linearGradient>
  </defs>
  <!-- Outer warm-cream & polycarbonate sphere -->
  <circle cx="32" cy="32" r="28" fill="url(#shell-light)" stroke="url(#rim-light)" stroke-width="2.5"/>
  <!-- Equatorial robotics seam -->
  <ellipse cx="32" cy="33" rx="27.5" ry="9.5" stroke="#0077b8" stroke-opacity="0.35" stroke-width="1.4" stroke-dasharray="4 3"/>
  <!-- Forward aim arc -->
  <path d="M22 10.5 A24 24 0 0 1 42 10.5" stroke="#0077b8" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Inner 8x8 LED Matrix housing -->
  <rect x="20" y="20" width="24" height="24" rx="4" fill="#18202c" stroke="#9e927b" stroke-width="1.2"/>
  <!-- Glowing BOLT LED Matrix Pixels -->
  <g fill="#38bdf8">
    <rect x="29" y="22.5" width="6" height="3" rx="0.8"/>
    <rect x="26" y="26.5" width="12" height="3" rx="0.8" fill="#0095e8"/>
    <rect x="23" y="30.5" width="18" height="3" rx="0.8" fill="#7dd3fc"/>
    <rect x="26" y="34.5" width="12" height="3" rx="0.8" fill="#0095e8"/>
    <rect x="29" y="38.5" width="6" height="3" rx="0.8"/>
  </g>
  <!-- Polycarbonate dome specular highlight -->
  <ellipse cx="22" cy="18" rx="7" ry="3.5" transform="rotate(-28 22 18)" fill="#ffffff" fill-opacity="0.65"/>
</svg>
